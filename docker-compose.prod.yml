services:
  frontend:
    build: ./frontend
    image: ghcr.io/pashus/card-mini-games-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backend:
    build: ./backend
    image: ghcr.io/pashus/card-mini-games-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:
